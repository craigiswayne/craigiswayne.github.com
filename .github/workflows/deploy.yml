# This workflow is designed to build and deploy your React project to GitHub Pages.
# It triggers automatically when code is pushed to the 'develop' branch.

name: Build and Deploy React App to GitHub Pages

on:
  push:
    branches:
      - feature/figma-portfolio # This workflow runs only on pushes to the 'develop' branch

jobs:
  build-and-deploy:
    # Use the latest version of Ubuntu as the runner
    runs-on: ubuntu-latest
    permissions:
      contents: write # This permission is required to push to the gh-pages branch

    steps:
      # Step 1: Check out the repository's code from the 'develop' branch
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # Step 2: Set up the specific version of Node.js you use in your project
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # You can change this to your desired Node.js version
          cache: 'npm' # Or 'yarn' if you use yarn

      # Step 3: Install the project dependencies
      - name: Install Dependencies 📦
        run: npm install # If you use yarn, change this to 'yarn install'

      # Step 4: Build the React application for production
      # The build output is typically in a 'build' or 'dist' folder.
      - name: Build Project 🏗️
        run: npm run build # If you use yarn, change this to 'yarn build'
        env:
          # If your project has a homepage in package.json, you might need to set the public url
          # For example, if your repo is at https://github.com/user/repo, the URL is /repo/
          PUBLIC_URL: /${{ github.event.repository.name }}

      # Step 5: Deploy the build folder to the 'gh-pages' branch
      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          # This token is automatically generated by GitHub Actions.
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # The directory that contains the built project files.
          publish_dir: ./build # Change this if your build output is in a different folder (e.g., ./dist)

          # --- IMPORTANT: EXCLUDE FILES HERE ---
          # Add a comma-separated list of files, directories, or patterns to exclude.
          # Common examples include .map files, .DS_Store, or specific assets you don't want deployed.
          exclude_assets: '.map, .DS_Store, CNAME, my-secret-folder/'

          # The user information for the commit that pushes to the gh-pages branch.
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

          # The commit message for the deployment.
          commit_message: 'Automated deployment to GitHub Pages'
